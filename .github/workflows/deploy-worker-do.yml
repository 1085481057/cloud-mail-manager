name: Deploy Worker DO migration

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloud-mail-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: b0cdf0f533088b0fb4d037f6702a181c
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Validate Worker syntax
        run: node --check worker.mjs && node --check background-push.mjs && node --check imap-provider.mjs && node --check mail-push-owner.mjs && node --check state-store.mjs
      - name: Validate Worker bundle
        run: npx wrangler deploy --dry-run --config wrangler.production.toml
      - name: Deploy production Worker
        run: npx wrangler deploy --config wrangler.production.toml
      - name: Verify health endpoint
        run: |
          for attempt in 1 2 3 4 5; do
            if [ "$(curl -fsS https://red-sea-7bc7.1085481057.workers.dev/health)" = "ok" ]; then
              exit 0
            fi
            sleep 5
          done
          exit 1
